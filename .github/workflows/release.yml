name: Signed notarized release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Confirm committed package.json version (numeric tag, no automatic bump)'
        required: true
        type: string
      publish:
        description: 'Publish a NEW version from main after all gates (false = candidate only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'miyako/hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm committed version and refuse an existing publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--preflight --version "$RELEASE_VERSION" --revision "$GITHUB_SHA")
          if [[ "$PUBLISH_RELEASE" == true ]]; then args+=(--publish); fi
          python3 scripts/publish-release.py "${args[@]}"
  native:
    needs: preflight
    uses: ./.github/workflows/native.yml
  component:
    needs: preflight
    uses: ./.github/workflows/component.yml
  sign:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'miyako/hash'
    needs: [native, component]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: build/release-inputs
      - name: Require exact-source four-host execution and clean real 4D reports
        run: python3 scripts/verify-release-inputs.py
      - name: Sign actual code objects and notarize both distributions
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: python3 scripts/sign-release.py --input build/release --output build/signed-release
      - name: Provision checksum-pinned 20.8 headless engine
        run: |
          set -euo pipefail
          mkdir -p tools/4dcli build/tool-downloads
          curl -fL --retry 2 --max-time 120 \
            https://resources-download.4d.com/release/20.x/20.8/latest/mac/tool4d_arm64.tar.xz \
            -o build/tool-downloads/tool4d-20.8-arm64.tar.xz
          echo 'da9c977dd85d4ee506a5d0c115f17d9f27ea487f402f0d642f4f2e1b186b560d  build/tool-downloads/tool4d-20.8-arm64.tar.xz' | shasum -a 256 -c -
          tar -xJf build/tool-downloads/tool4d-20.8-arm64.tar.xz -C tools/4dcli
          codesign --verify --strict tools/4dcli/tool4d.app
      - name: Execute the extracted signed component in a clean compiled host
        run: |
          set -euo pipefail
          mkdir -p build/signed-extracted
          ditto -x -k build/signed-release/hash.zip build/signed-extracted
          python3 scripts/test-4d.py --engine "$PWD/tools/4dcli/tool4d.app/Contents/MacOS/tool4d" \
            --component "$PWD/build/signed-extracted/hash.4dbase"
          python3 scripts/finalize-release.py
      - name: Remove ephemeral signing credentials even after cancellation
        if: always()
        run: python3 scripts/sign-release.py --cleanup
      - name: Preserve final distributions and redacted notarization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: |
            build/publish-files/
            build/signed-release/
            build/4d/*-compile.json
            build/4d/verification.json
            build/4d/executions/
          if-no-files-found: error
      - name: Validate the exact final public asset set and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/publish-release.py --version "$RELEASE_VERSION" --revision "$GITHUB_SHA"
      - name: Handoff only a fully successful finalized candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-publish-files
          path: build/publish-files/
          if-no-files-found: error
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'miyako/hash' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish
    needs: [preflight, native, component, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-publish-files
          path: build/publish-files
      - name: Revalidate, upload draft, verify exact downloaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/publish-release.py --publish --version "$RELEASE_VERSION" --revision "$GITHUB_SHA"
